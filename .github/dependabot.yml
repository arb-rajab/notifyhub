version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # ts-jest@29 peers on typescript ">=4.3 <7"; revisit when ts-jest supports TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
