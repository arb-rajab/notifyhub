name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notifyhub
          POSTGRES_PASSWORD: notifyhub_test_pw
          POSTGRES_DB: notifyhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notifyhub -d notifyhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://notifyhub:notifyhub_test_pw@localhost:5432/notifyhub_test?schema=public
      JWT_SECRET: ci-test-secret-not-for-production-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test -- --coverage
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: notifyhub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A `dependency-review` job (actions/dependency-review-action) was tried
  # here but removed: it requires the repository's "Dependency graph"
  # setting (github.com/<owner>/<repo>/settings/security_analysis) to be
  # enabled, which is an account-level toggle outside this workflow's and
  # this session's control. Dependabot (.github/dependabot.yml) already
  # covers ongoing dependency update/vulnerability tracking for this repo.
